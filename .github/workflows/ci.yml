name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  verify:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Supabase clients are constructed per request, so the build needs no secrets.
      - run: npm run build
